name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gocardless-checkout/**"
      - "supabase/functions/gocardless-webhook/**"
      - "supabase/functions/gocardless-sync/**"
      - "supabase/functions/send-email/**"
      - "supabase/functions/marketing-unsubscribe/**"
      - "supabase/functions/mix-match-membership/**"
      - "supabase/functions/referral-scheme/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/20261012000000_move_boxfit_booking_dates.sql"
      - "supabase/migrations/20261015000000_taster_card_eligibility.sql"
      - "supabase/migrations/20261015010000_resume_unfinished_tasters.sql"
      - "supabase/migrations/20261016000000_course_places.sql"
      - "supabase/migrations/20261017000000_marketing_consent.sql"
      - "supabase/migrations/20261017010000_signup_welcome.sql"
      - "supabase/migrations/20261017020000_registration_consent_wording.sql"
      - "supabase/migrations/20261017030000_mix_match_memberships.sql"
      - "supabase/migrations/20261017040000_referral_scheme.sql"
      - "supabase/migrations/20261018000000_referral_membership_credits.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-payment-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF is not configured"; exit 1; }

      - name: Check Edge Functions
        run: node scripts/check-edge-functions.mjs

      # Apply the agreed date correction before deploying membership recovery
      # that follows the Thursday schedule. The UPDATE is safe to re-run.
      - name: Move October BoxFit reservations to Thursdays
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const query = readFileSync('supabase/migrations/20261012000000_move_boxfit_booking_dates.sql', 'utf8');
          writeFileSync(process.env.RUNNER_TEMP + '/boxfit-date-update.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/boxfit-date-update.json" \
            --output "$RUNNER_TEMP/boxfit-date-update-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/boxfit-date-update-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || !/^\d+$/.test(String(result[0]?.moved_bookings))) {
            throw new Error('Supabase did not confirm the BoxFit date correction; stop before deploying payment functions.');
          }
          console.log('BoxFit bookings moved:', result[0].moved_bookings);
          NODE

      - name: Make lifetime taster availability readable by the booking app
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = [
            'supabase/migrations/20261007000000_lifetime_class_tasters.sql',
            'supabase/migrations/20261008010000_regular_zumba_taster_eligibility.sql',
            'supabase/migrations/20261015000000_taster_card_eligibility.sql',
            'supabase/migrations/20261015010000_resume_unfinished_tasters.sql',
          ];
          const query = 'begin;\n' + files.map(file => readFileSync(file, 'utf8')).join('\n') +
            '\ncommit;\nselect to_regprocedure(\'public.class_taster_eligibility(text,text)\') is not null as taster_availability_ready;';
          writeFileSync(process.env.RUNNER_TEMP + '/taster-eligibility.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/taster-eligibility.json" \
            --output "$RUNNER_TEMP/taster-eligibility-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/taster-eligibility-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || result[0]?.taster_availability_ready !== true) {
            throw new Error('Supabase did not confirm the taster availability migration.');
          }
          console.log('Lifetime taster availability function updated.');
          NODE

      - name: Ensure course purchase quantities are available
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const query = readFileSync('supabase/migrations/20261016000000_course_places.sql', 'utf8') +
            "\nselect exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'bookings' and column_name = 'num_people') as course_places_ready;";
          writeFileSync(process.env.RUNNER_TEMP + '/course-places.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/course-places.json" \
            --output "$RUNNER_TEMP/course-places-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/course-places-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || result[0]?.course_places_ready !== true) {
            throw new Error('Course quantity migration was not confirmed; stop before payment deployment.');
          }
          console.log('Course purchase quantities ready.');
          NODE

      - name: Ensure marketing choices and unsubscribe are available
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const query = readFileSync('supabase/migrations/20261017000000_marketing_consent.sql', 'utf8') +
            readFileSync('supabase/migrations/20261017010000_signup_welcome.sql', 'utf8') +
            readFileSync('supabase/migrations/20261017020000_registration_consent_wording.sql', 'utf8') +
            "\nselect to_regprocedure('public.save_marketing_preferences(text,boolean,boolean,boolean)') is not null and to_regprocedure('public.marketing_email_recipient(text)') is not null and to_regprocedure('public.unsubscribe_marketing_email(text)') is not null and to_regprocedure('public.prepare_signup_verification(text,text)') is not null and to_regprocedure('public.signup_welcome_recipient(text,text)') is not null and to_regprocedure('public.mark_signup_welcome_sent(text,uuid)') is not null as marketing_consent_ready;";
          writeFileSync(process.env.RUNNER_TEMP + '/marketing-consent.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/marketing-consent.json" \
            --output "$RUNNER_TEMP/marketing-consent-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/marketing-consent-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || result[0]?.marketing_consent_ready !== true) {
            throw new Error('Marketing consent migration was not confirmed.');
          }
          console.log('Marketing choices and unsubscribe ready.');
          NODE

      - name: Deploy marketing unsubscribe
        run: supabase functions deploy marketing-unsubscribe --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Ensure Mix and Match renewal date selection is available
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const query = readFileSync('supabase/migrations/20261017030000_mix_match_memberships.sql', 'utf8') +
            "\nselect to_regprocedure('public.record_mix_match_renewal(jsonb)') is not null and to_regprocedure('public.mix_match_months_for_member(text)') is not null and to_regprocedure('public.select_mix_match_dates(text,text,jsonb)') is not null as mix_match_ready;";
          writeFileSync(process.env.RUNNER_TEMP + '/mix-match.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/mix-match.json" \
            --output "$RUNNER_TEMP/mix-match-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/mix-match-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || result[0]?.mix_match_ready !== true) throw new Error('Mix and Match storage was not confirmed.');
          console.log('Mix and Match paid renewals and date selection ready.');
          NODE

      - name: Deploy Mix and Match membership dates
        run: supabase functions deploy mix-match-membership --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Ensure referral rewards are available
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = ['supabase/migrations/20261017040000_referral_scheme.sql', 'supabase/migrations/20261018000000_referral_membership_credits.sql'];
          // Apply the original and follow-on definitions atomically. A redeploy
          // must never briefly expose redemption without the reservation guard.
          const query = 'begin;\n' + files.map(file => readFileSync(file, 'utf8').replace(/^begin;[ \t]*$/gm, '').replace(/^commit;[ \t]*$/gm, '')).join('\n') + '\ncommit;' +
            "\nselect to_regprocedure('public.bind_referral_checkout(text,text,text)') is not null and to_regprocedure('public.referral_checkout_for_booking(text)') is not null and to_regprocedure('public.award_referral_reward(jsonb)') is not null and to_regprocedure('public.referral_dashboard(text)') is not null and to_regprocedure('public.redeem_referral_reward(text,uuid,text,date)') is not null and to_regprocedure('public.prepare_referral_access(text,text)') is not null and to_regprocedure('public.verify_referral_access(text,text,text)') is not null and to_regprocedure('public.authorize_referral_access(text,text)') is not null and to_regprocedure('public.revoke_referral_access(text,text)') is not null and to_regprocedure('public.referral_discount_state(text,jsonb)') is not null and to_regprocedure('public.referral_reward_notices(text,text)') is not null and to_regprocedure('public.mark_referral_reward_notice(uuid)') is not null and to_regprocedure('public.sync_referral_credit_entry(uuid)') is not null and to_regclass('snb_private.referral_credits') is not null as referral_ready;";
          writeFileSync(process.env.RUNNER_TEMP + '/referral.json', JSON.stringify({ query }));
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/referral.json" \
            --output "$RUNNER_TEMP/referral-result.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/referral-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1 || result[0]?.referral_ready !== true) throw new Error('Referral storage was not confirmed.');
          console.log('Referral attribution and private rewards ready.');
          NODE

      - name: Deploy referral scheme
        run: supabase functions deploy referral-scheme --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy email sender
        run: supabase functions deploy send-email --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy GoCardless checkout
        run: supabase functions deploy gocardless-checkout --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy GoCardless webhook
        run: supabase functions deploy gocardless-webhook --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy GoCardless booking sync
        run: supabase functions deploy gocardless-sync --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
