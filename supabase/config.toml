[functions.gocardless-webhook]
verify_jwt = false

[functions.admin-auth]
verify_jwt = false

# Members authenticate with the app's own session rather than Supabase Auth.
# Allow the browser to invoke the mailer with the public project key; otherwise
# Supabase rejects cancellation requests before the function can send either
# the member confirmation or the admin notification.
[functions.send-email]
verify_jwt = false

# The server verifies the original checkout with GoCardless. A browser return
# or a public project key alone cannot allocate a class or mark payment paid.
[functions.gocardless-sync]
verify_jwt = false

# Opaque per-member token authorizes withdrawal; no login is required.
[functions.marketing-unsubscribe]
verify_jwt = false

# Same custom member sessions as Account; private paid credits are checked server-side.
[functions.mix-match-membership]
verify_jwt = false

# Public access challenge; dashboard/redemption check server-issued member tokens.
[functions.referral-scheme]
verify_jwt = false

# The handler verifies the signed admin MFA session before using service access.
[functions.admin-class-booking]
verify_jwt = false
